<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided in `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="记录每天的计划、完成和反思">

  <!-- 禁止缓存 index.html，确保每次打开都是最新版本 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="每日日记">
  <meta name="theme-color" content="#FF8A65">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>每日日记</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Force Flutter to use local CanvasKit (bundled with app)
    // instead of loading from Google CDN (gstatic.com) which is blocked in China
    window.flutterConfiguration = {
      canvasKitBaseUrl: "canvaskit/"
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
